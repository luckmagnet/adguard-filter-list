name: Automated Checks

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  pre-commit:
    name: pre-commit Checks
    runs-on: ubuntu-latest
    
    permissions:
      contents: write # Required to push fixes back to the repository

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          check-latest: true

      - name: Run Pre Commit Checks
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files
        continue-on-error: true # Allows the pipeline to continue so auto-commit can save the fixes

      - name: Auto-commit formatting fixes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "style: auto-fix markdown formatting via pre-commit"
          file_pattern: "*.md"
